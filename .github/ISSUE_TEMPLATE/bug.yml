name: Bug
description: 재현 가능한 오류, 영향 범위와 회귀 방지 조건을 기록합니다.
title: "[Bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: 문제 요약
      description: 무엇이 잘못되었는지 한두 문장으로 적어주세요.
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: 영향도
      options:
        - High — 실험 결과가 틀렸거나 재현할 수 없음
        - Medium — 일부 조건이나 단계가 실패하고 우회가 제한적임
        - Low — 경미한 오류 또는 사용성 문제
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차와 환경
      description: 실행 명령, 입력, 환경(GPU, 엔진, 의존성 버전)을 적어주세요.
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: 기대 동작과 실제 동작
      description: 기대한 결과와 실제 결과, 로그 등 증거를 적어주세요.
    validations:
      required: true

  - type: textarea
    id: affected_results
    attributes:
      label: 영향받는 실험 결과
      description: 이 오류로 다시 확인해야 할 결과나 보고서를 적습니다. 없으면 "없음"으로 작성합니다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 수정 범위와 Non-Goals
      description: 수정할 범위와 함께 수정하지 않을 영역을 적어주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건과 회귀 테스트
      value: |
        - [ ] 최소 재현 테스트가 수정 전 실패하고 수정 후 통과한다.
        - [ ] 기존 정상 경로 테스트가 통과한다.
    validations:
      required: true

  - type: input
    id: branch_slug
    attributes:
      label: 브랜치 slug
      description: Issue 생성 후 agent/{issue-number}-{slug} 브랜치와 전용 worktree에 사용합니다.
      placeholder: fix-strict-parse
    validations:
      required: true

  - type: dropdown
    id: agent_permission
    attributes:
      label: 에이전트 작업 범위
      description: 선택한 작업 범위만 허용됩니다. push와 PR 생성 선택값에도 병합 권한은 포함되지 않습니다.
      options:
        - 조사와 진단만 허용 — 파일 변경 금지
        - 파일 수정과 검증까지 허용 — 커밋 금지
        - 검증된 로컬 커밋까지 허용
        - 검증된 로컬 커밋 및 push·PR 생성까지 허용 — 병합 금지
    validations:
      required: true

  - type: checkboxes
    id: ready
    attributes:
      label: 조사 준비 확인
      options:
        - label: 재현 정보에서 비밀 정보와 개인정보를 제거했습니다.
          required: true
