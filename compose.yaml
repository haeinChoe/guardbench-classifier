# Fixed project name: container_name is fixed too, so `up`/`down` from any worktree must address
# the same project.
name: guardbench-classifier

# Local vLLM OpenAI-compatible server for experiments.
#   uv run --env-file .env guardbench-vllm up [qwen|encoder]   # one server: check free GPU memory, start, wait
#   uv run --env-file .env guardbench-vllm down                # stop everything and free the GPU
# `guardbench-vllm` passes the values it checked to docker compose as process environment variables
# (they take precedence over .env). The encoder service is in the `encoder` profile and needs
# VLLM_ENCODER_CHECKPOINT_DIR. Servers are started one at a time: Qwen and the encoder together do
# not fit in the GPU memory left by other jobs.
# Runs in Docker because vLLM 0.16.0 wheels need glibc >= 2.31 (the host is Rocky Linux 8, glibc 2.28).
services:
  vllm:
    image: vllm/vllm-openai:v0.16.0@sha256:4801151759655c57606c844662e5213403c032a62d149c7ce61d615759a821ef
    container_name: guardbench-vllm
    entrypoint: ["vllm", "serve"]
    command:
      - "${VLLM_MODEL:-Qwen/Qwen3-4B}"
      - "--revision=${VLLM_MODEL_REVISION:-1cfa9a7208912126459214e8b04321603b3df60c}"
      - "--dtype=bfloat16"
      - "--gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.65}"
      - "--max-model-len=${VLLM_MAX_MODEL_LEN:-8192}"
      - "--seed=0"
      # Do not inherit sampling defaults from the model's generation_config; requests set them explicitly.
      - "--generation-config=vllm"
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"
    ipc: host
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - "${HF_CACHE_DIR:-${HOME}/.cache/huggingface}:/root/.cache/huggingface"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Optional classification encoder. Serves a local checkpoint directory (mounted read-only);
  # no checkpoint path is fixed here. Same image as vllm.
  vllm-encoder:
    profiles: ["encoder"]
    image: vllm/vllm-openai:v0.16.0@sha256:4801151759655c57606c844662e5213403c032a62d149c7ce61d615759a821ef
    container_name: guardbench-vllm-encoder
    entrypoint: ["vllm", "serve"]
    command:
      - "/models/encoder"
      # Pinned: vLLM would otherwise pick fp16, and predictions differ between precisions.
      - "--dtype=${VLLM_ENCODER_DTYPE:-float32}"
      - "--gpu-memory-utilization=${VLLM_ENCODER_GPU_MEMORY_UTILIZATION:-0.10}"
      - "--seed=0"
    ports:
      - "127.0.0.1:${VLLM_ENCODER_PORT:-8001}:8000"
    ipc: host
    environment:
      # The checkpoint is local; never download anything for this service.
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - "${VLLM_ENCODER_CHECKPOINT_DIR:-./checkpoints/encoder-not-configured}:/models/encoder:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
